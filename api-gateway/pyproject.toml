[project]
name = "sdc-api-gateway"
version = "0.1.0"
description = "Authenticated REST/SSE facade over the server-owned Cline control API"
requires-python = "==3.13.16"
dependencies = [
    "fastapi==0.142.4",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "pydantic==2.12.5",
]

[dependency-groups]
dev = [
    "openai==3.26.0",
    "anthropic==1.12.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
