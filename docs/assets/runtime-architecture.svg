<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-labelledby="title description">
<title id="title">One server. One consented native task.</title><desc id="description">Browser and API clients connect through Nginx. API routes pass through FastAPI to the TypeScript server. The server owns PostgreSQL and attachments and validates OIDC identity. The desktop bridge initiates HTTPS POST and SSE connections, persists receipts in SQLite, and controls a consented Cline task through the reviewed native API. Cline connects to its configured model service.</desc>
