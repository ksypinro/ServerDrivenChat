<text x="1310" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#50627a" text-anchor="middle">Native app</text>
<rect x="44" y="325" width="1352" height="34" rx="7" fill="#e8edf6" stroke="#e8edf6"/>
<text x="62" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#345de3" text-anchor="start">01  ADMIT THE REQUEST</text>
