<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title description">
<title id="title">From prompt to recorded response</title><desc id="description">Sequence diagram with six participants: user, API client, FastAPI gateway, TypeScript server, desktop bridge and Cline. Steps show prompt submission, authentication and request identity, server persistence, SSE delivery, local authority checks, native execution, acknowledgements and persisted output returned to the caller.</desc>
<defs>
 <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345de3"/></marker>
 <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e83"/></marker>
 <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50627a"/></marker>
</defs>
<rect width="1440" height="1440" rx="24" fill="#f5f7fc"/>
<rect x="0" y="0" width="1440" height="130" rx="24" fill="#172b46"/>
<rect x="0" y="90" width="1440" height="40" fill="#172b46"/>

<text x="44" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#a9c3f7" text-anchor="start">SERVER-DRIVEN CHAT  /  SYSTEM DESIGN</text>
<text x="44" y="75" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">From prompt to recorded response</text>
<text x="44" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#d3deef" text-anchor="start">An API request travels through durable admission, native execution and correlated events.</text>
<rect x="44" y="151" width="1352" height="50" rx="10" fill="#eaf5f4" stroke="#bfdedb"/>
<text x="64" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087e83" text-anchor="start">PRECONDITION</text>
<text x="195" y="183" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172b46" text-anchor="start">Graphical sign-in, pairing, task selection and local consent are already complete.</text>
<path d="M 130 304 V 1300" stroke="#c6d1e2" stroke-width="1.5" stroke-dasharray="5 7"/>
<rect x="39" y="224" width="182" height="80" rx="14" fill="#ffffff" stroke="#cad7ef"/>
