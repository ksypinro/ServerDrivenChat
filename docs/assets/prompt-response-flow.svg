<text x="602" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#50627a" text-anchor="middle">FastAPI</text>
<path d="M 838 304 V 1300" stroke="#c6d1e2" stroke-width="1.5" stroke-dasharray="5 7"/>
<rect x="747" y="224" width="182" height="80" rx="14" fill="#ffffff" stroke="#cad7ef"/>
<text x="838" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172b46" text-anchor="middle">Server</text>
<text x="838" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#50627a" text-anchor="middle">TypeScript</text>
<path d="M 1074 304 V 1300" stroke="#c6d1e2" stroke-width="1.5" stroke-dasharray="5 7"/>
