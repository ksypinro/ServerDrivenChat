<rect x="630.15" y="497" width="179.70000000000002" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="720.0" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#345de3" text-anchor="middle">Normalize and forward</text>
<circle cx="585" cy="527" r="12" fill="#345de3"/>
<text x="585" y="531" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="733" y="552" width="210" height="62" rx="9" fill="#eef1fe" stroke="#cbd5f6"/>
<text x="838" y="577" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Check scope and readiness</text>
<text x="838" y="599" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Persist durable operation</text>
<rect x="44" y="644" width="1352" height="34" rx="7" fill="#e8edf6" stroke="#e8edf6"/>
<text x="62" y="667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#345de3" text-anchor="start">02  DELIVER AND EXECUTE</text>
<path d="M 838 718 H 1074" fill="none" stroke="#345de3" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
