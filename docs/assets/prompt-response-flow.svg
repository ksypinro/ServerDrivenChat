<text x="484.0" y="1241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#087e83" text-anchor="middle">Profile response / SSE</text>
<circle cx="619" cy="1254" r="12" fill="#087e83"/>
<text x="619" y="1258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<path d="M 366 1298 H 130" fill="none" stroke="#087e83" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="154.3" y="1268" width="187.4" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="248.0" y="1285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#087e83" text-anchor="middle">Display result + state</text>
<circle cx="383" cy="1298" r="12" fill="#087e83"/>
<text x="383" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<rect x="44" y="1340" width="1352" height="70" rx="12" fill="#ffffff" stroke="#d8e0ef"/>
<text x="66" y="1368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#345de3" text-anchor="start">ACCEPTED ≠ COMPLETED</text>
<text x="300" y="1368" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">HTTP admission records work; native events establish its outcome.</text>
<text x="66" y="1394" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#50627a" text-anchor="start">Provider streams return committed output using the profile’s buffering rules. Local permissions remain authoritative.</text>
</svg>
