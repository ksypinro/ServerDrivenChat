<text x="821" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="969" y="743" width="210" height="62" rx="9" fill="#eef1fe" stroke="#cbd5f6"/>
<text x="1074" y="768" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Persist local receipt</text>
<text x="1074" y="790" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Check current authority</text>
<path d="M 1074 851 H 1310" fill="none" stroke="#345de3" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="1121.4" y="821" width="141.2" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="1192.0" y="838" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#345de3" text-anchor="middle">Native API input</text>
<circle cx="1057" cy="851" r="12" fill="#345de3"/>
<text x="1057" y="855" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<path d="M 1310 923 H 1074" fill="none" stroke="#087e83" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="1132.95" y="893" width="118.10000000000001" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="1192.0" y="910" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#087e83" text-anchor="middle">Native events</text>
<circle cx="1327" cy="923" r="12" fill="#087e83"/>
<text x="1327" y="927" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="1290" y="957" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#50627a" text-anchor="end">Output, question, approval</text>
<text x="1290" y="979" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#50627a" text-anchor="end">request or terminal event</text>
<rect x="44" y="1003" width="1352" height="34" rx="7" fill="#e8edf6" stroke="#e8edf6"/>
<text x="62" y="1026" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087e83" text-anchor="start">03  RECORD AND RETURN</text>
<path d="M 1074 1080 H 838" fill="none" stroke="#087e83" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="862.3" y="1050" width="187.4" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="956.0" y="1067" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#087e83" text-anchor="middle">POST receipts + events</text>
<circle cx="1091" cy="1080" r="12" fill="#087e83"/>
<text x="1091" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<rect x="733" y="1103" width="210" height="62" rx="9" fill="#eef1fe" stroke="#cbd5f6"/>
<text x="838" y="1128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Persist events</text>
<text x="838" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172b46" text-anchor="middle">Update operation state</text>
<path d="M 838 1210 H 602" fill="none" stroke="#087e83" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="630.15" y="1180" width="179.70000000000002" height="25" rx="6" fill="#f5f7fc" stroke="#f5f7fc"/>
<text x="720.0" y="1197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#087e83" text-anchor="middle">Result / event stream</text>
<circle cx="855" cy="1210" r="12" fill="#087e83"/>
<text x="855" y="1214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<path d="M 602 1254 H 366" fill="none" stroke="#087e83" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
