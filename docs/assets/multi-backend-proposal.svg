<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title description">
<title id="title">Three backends. One shared contract.</title><desc id="description">Proposed architecture: browser and API clients use the existing server control plane, generic VS Code host, neutral adapter contract and registry. Cline, Codex and Claude Code drivers map to their respective existing native conversations. The generic host and new drivers are proposed; Codex and Claude routes require feasibility and acceptance.</desc>
