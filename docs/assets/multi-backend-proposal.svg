<text x="44" y="75" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">Three backends. One shared contract.</text>
<text x="44" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#d3deef" text-anchor="start">Proposed architecture · installed extensions are not yet qualified SDC backends.</text>
