name: sdc-production
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    env_file:
      - ${SDC_DB_ENV_FILE:?Set SDC_DB_ENV_FILE to a protected file outside the checkout}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  server:
    stop_grace_period: 35s
    build:
      context: ../..
      dockerfile: deploy/m24/Dockerfile.server
    image: ${SDC_SERVER_IMAGE:-sdc-server:m24-candidate}
    restart: unless-stopped
    env_file:
      - ${SDC_SERVER_ENV_FILE:?Set SDC_SERVER_ENV_FILE to a protected file outside the checkout}
    environment:
      SDC_SERVER_HOST: 0.0.0.0
      SDC_SERVER_PORT: 3000
      SDC_DECISION_PRIVATE_KEY_PATH: /run/sdc/decision-ed25519.pem
      SDC_ATTACHMENT_DIR: /var/lib/sdc/attachments
    volumes:
      - ${SDC_DECISION_KEY_FILE:?Set SDC_DECISION_KEY_FILE to the protected Ed25519 private key}:/run/sdc/decision-ed25519.pem:ro
      - ${SDC_ATTACHMENT_DIR:?Set SDC_ATTACHMENT_DIR to a persistent directory owned by uid 1000}:/var/lib/sdc/attachments
    networks:
      - edge
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v2/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 25s

  gateway:
    stop_grace_period: 35s
    build:
      context: ../..
      dockerfile: deploy/m24/Dockerfile.gateway
    image: ${SDC_GATEWAY_IMAGE:-sdc-gateway:m24-candidate}
    restart: unless-stopped
    env_file:
      - ${SDC_GATEWAY_ENV_FILE:?Set SDC_GATEWAY_ENV_FILE to a protected file outside the checkout}
    environment:
      SDC_GATEWAY_HOST: 0.0.0.0
      SDC_GATEWAY_PORT: 8000
      SDC_SERVER_URL: http://server:3000
      SDC_TRUSTED_HTTP_UPSTREAMS: http://server:3000
    networks:
      - edge
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    environment:
      SDC_DOMAIN: ${SDC_DOMAIN:?Set SDC_DOMAIN to the DNS name covered by the TLS certificate}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SDC_TLS_DIR:?Set SDC_TLS_DIR to a protected directory containing fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=2m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  postgres-data:
